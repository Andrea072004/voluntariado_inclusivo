<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Perfil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/perfil.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css">
</head>
<body class="perfil-body">
  <!-- Navbar dinámico -->
  <div id="navbar-container"></div>

  <!-- Contenedor principal -->
  <div class="register-container">
    <div class="form-box">
      <h2>Editar Perfil</h2> 
      <form id="editarPerfilForm">
        <!-- Sección 1 -->
        <div class="form-section">
          <h3>Datos personales</h3>
          <div class="form-grid">
            <div>
              <label for="nombre">Nombre completo</label>
              <input type="text" id="nombre" name="nombre" required>
            </div>
            <div>
              <label for="fechaNacimiento">Fecha de nacimiento</label>
              <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            </div>
            <div>
              <label for="edad">Edad</label>
              <input type="number" id="edad" name="edad" min="0" required>
            </div>
            <div>
              <label for="correo">Correo electrónico</label>
              <input type="email" id="correo" name="correo" required disabled>
            </div>
          </div>
        </div>

        <!-- Sección 2 -->
        <div class="form-section">
          <h3>Perfil como voluntario</h3>
          <div class="form-grid">
            <div>
              <label for="cronica">Enfermedad crónica</label>
              <select id="cronica" name="cronica">
                <option value="">Ninguna</option>
                <option>Hipertensión</option>
                <option>Diabetes</option>
                <option>Insuficiencia cardiaca</option>
                <option>Arritmias</option>
                <option>Trombosis</option>
                <option>Artritis</option>
                <option>Cáncer</option>
                <option>Insuficiencia renal</option>
                <option>Fibrosis pulmonar</option>
              </select>
            </div>
            <div>
              <label for="discapacidad">Tipo de discapacidad</label>
              <select id="discapacidad" name="discapacidad">
                <option value="">Ninguna</option>
                <option>Visual</option>
                <option>Auditiva</option>
                <option>Motora</option>
                <option>Intelectual</option>
              </select>
            </div>
            <div>
              <label for="motivo">Motivo para ser voluntario</label>
              <select id="motivo" name="motivo" required>
                <option value="">Seleccione</option>
                <option>Apoyar</option>
                <option>Aprender</option>
                <option>Conectar</option>
                <option>Rehabilitar</option>
              </select>
            </div>
            <div>
              <label for="intereses">Intereses</label>
              <select id="intereses" name="intereses" required>
                <option value="">Seleccione</option>
                <option>Acompañamiento emocional virtual</option>
                <option>Lectura inclusiva a domicilio</option>
                <option>Educación digital para personas con discapacidad</option>
                <option>Campañas de inclusión y sensibilización</option>
                <option>Clasificación y donación de ropa</option>
                <option>Apoyo escolar inclusivo</option>
                <option>Terapias físicas o creativas</option>
                <option>Huertos y agricultura urbana inclusiva</option>
                <option>Actividades culturales y museos adaptados</option>
                <option>Asistencia en comedores populares</option>
                <option>Manualidades con adultos mayores</option>
                <option>Cuido de animales con necesidades especiales</option>
                <option>Acompañamiento en hospitales</option>
                <option>Eventos deportivos inclusivos</option>
                <option>Paseos y caminatas inclusivas</option>
              </select>
            </div>
            <div>
              <label for="habilidades">Habilidades</label>
              <input type="text" id="habilidades" name="habilidades" required>
            </div>
            <div>
              <label for="autonomia">Nivel de autonomía</label>
              <select id="autonomia" name="autonomia" required>
                <option value="">Seleccione</option>
                <option value="libre">Apoyo libre</option>
                <option value="moderado">Moderado</option>
                <option value="total">Total</option>
              </select>
            </div>
          </div>
        </div>
        
        <div id="mensaje"></div>
        <button type="submit">Guardar cambios</button>
      </form>
    </div>
  </div>

  <script>
    fetch("components/navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar-container").innerHTML = data;

        // Botones usuario
        const botonesUsuario = document.getElementById('botonesUsuario');
        const userId = localStorage.getItem('userId');

        if (botonesUsuario) {
          if (userId) {
            botonesUsuario.innerHTML = `
              <a href="perfil.html" title="Mi perfil"><i class="fas fa-user"></i></a>
              <button onclick="cerrarSesion()" class="btn btn-primario">Cerrar sesión</button>
            `;
          } else {
            botonesUsuario.innerHTML = `
              <a href="register.html"><button class="btn btn-secundario">Registrarse</button></a>
              <a href="login.html"><button class="btn btn-primario">Iniciar sesión</button></a>
            `;
          }
        }
      });

    function cerrarSesion() {
      localStorage.removeItem('userId');
      localStorage.setItem('mensajePerfil', 'Sesión cerrada correctamente.');
      window.location.href = 'index.html';
    }
  </script>

  <!-- Solo necesitas estos dos -->
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>

<script>
  const userId = localStorage.getItem('userId');

  const firebaseConfig = {
    apiKey: "AIzaSyAqzhyPVGvQQdcQZ0D21CrJ6kltR_JM_Co",
    authDomain: "voluntariado-inclusivo.firebaseapp.com",
    projectId: "voluntariado-inclusivo",
    storageBucket: "voluntariado-inclusivo.appspot.com",
    messagingSenderId: "400448703475",
    appId: "1:400448703475:web:72c8742f2a830e0f48e086"
  };

  // Inicializar Firebase
  firebase.initializeApp(firebaseConfig);

  // Referencia a Firestore
  const db = firebase.firestore();

  // Redirigir si no hay sesión
  if (!userId) {
    alert('No se ha iniciado sesión.');
    window.location.href = 'login.html';
  } else {
    db.collection('usuarios').doc(userId).get().then(doc => {
      if (doc.exists) {
        const datos = doc.data();
        document.getElementById('nombre').value = datos.nombre || '';
        document.getElementById('fechaNacimiento').value = datos.fechaNacimiento || '';
        document.getElementById('edad').value = datos.edad || '';
        document.getElementById('correo').value = datos.correo || '';
        document.getElementById('cronica').value = datos.cronica || '';
        document.getElementById('discapacidad').value = datos.discapacidad || '';
        document.getElementById('motivo').value = datos.motivo || '';
        document.getElementById('intereses').value = datos.intereses || '';
        document.getElementById('habilidades').value = datos.habilidades || '';
        document.getElementById('autonomia').value = datos.autonomia || '';
      } else {
        console.log("No se encontró el documento.");
      }
    }).catch(error => {
      console.error("Error al obtener datos:", error);
    });
  }

  document.getElementById('editarPerfilForm').addEventListener('submit', function (e) {
    e.preventDefault();

    const nombre = document.getElementById('nombre').value.trim();
    const fechaNacimiento = document.getElementById('fechaNacimiento').value;
    const edad = parseInt(document.getElementById('edad').value);
    const cronica = document.getElementById('cronica').value;
    const discapacidad = document.getElementById('discapacidad').value;
    const motivo = document.getElementById('motivo').value;
    const intereses = document.getElementById('intereses').value;
    const habilidades = document.getElementById('habilidades').value.trim();
    const autonomia = document.getElementById('autonomia').value;

    const mensaje = document.getElementById('mensaje');

    if (!nombre || !fechaNacimiento || !motivo || !intereses || !habilidades || !autonomia) {
      mensaje.textContent = 'Por favor, complete todos los campos obligatorios.';
      mensaje.className = 'mensaje error';
      return;
    }

    db.collection('usuarios').doc(userId).update({
      nombre,
      fechaNacimiento,
      edad,
      cronica,
      discapacidad,
      motivo,
      intereses,
      habilidades,
      autonomia
    }).then(() => {
      mensaje.textContent = 'Datos actualizados correctamente.';
      mensaje.className = 'mensaje exito';

      if (Notification.permission === 'granted') {
        new Notification('Perfil actualizado con éxito.');
      } else if (Notification.permission !== 'denied') {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            new Notification('Perfil actualizado con éxito.');
          }
        });
      }
    }).catch(error => {
      mensaje.textContent = 'Error al actualizar: ' + error.message;
      mensaje.className = 'mensaje error';
    });
  });
</script>


</body>
</html>
