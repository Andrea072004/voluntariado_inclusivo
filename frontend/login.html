<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Voluntariado Inclusivo - Iniciar Sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-body">

  <!-- Navbar dinámico -->
  <div id="navbar-container"></div>

  <!-- LOGIN -->
  <div class="login-container">
    <div class="login-header">
      <img src="img/logo_incluvoluntariado.jpg" alt="Logo Voluntariado" class="logo-login" />
      <h2>Iniciar Sesión</h2>
      <p>¿No tienes cuenta? <a href="register.html">Regístrate ahora</a></p>
    </div>

    <form id="loginForm">
      <div class="campo-formulario">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required />
        <span class="error" id="error-email"></span>
      </div>

      <div class="campo-formulario">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required />
        <span class="error" id="error-password"></span>
      </div>

      <div class="campo-check">
        <input type="checkbox" id="mostrarContrasena" />
        <label for="mostrarContrasena">Mostrar contraseña</label>
      </div>

      <button type="submit" class="btn btn-login">Iniciar sesión</button>

      <div class="enlace-olvido">
        <a href="#" onclick="abrirModal()">¿Olvidaste tu contraseña?</a>
      </div>
    </form>

    <footer class="login-footer">
      <p>&copy; 2025 Voluntariado Inclusivo</p>
    </footer>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">
    <i>✔</i> <span id="toast-text">Sesión iniciada correctamente</span>
    <button onclick="cerrarToast()">×</button>
  </div>

  <!-- Modal Recuperar -->
  <div id="modalRecuperar" class="modal">
    <div class="modal-content">
      <h3>Recuperar Contraseña</h3>
      <input type="text" id="recuperarNombre" placeholder="Nombre completo" />
      <input type="email" id="recuperarCorreo" placeholder="Correo electrónico" />
      <button onclick="verificarDatos()">Recuperar</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
    apiKey: "AIzaSyAqzhyPVGvQQdcQZ0D21CrJ6kltR_JM_Co",
    authDomain: "voluntariado-inclusivo.firebaseapp.com",
    projectId: "voluntariado-inclusivo",
    storageBucket: "voluntariado-inclusivo.appspot.com",
    messagingSenderId: "400448703475",
    appId: "1:400448703475:web:72c8742f2a830e0f48e086"
  };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value.trim();
      const errorEmail = document.getElementById("error-email");
      const errorPassword = document.getElementById("error-password");
      errorEmail.textContent = "";
      errorPassword.textContent = "";

      if (!email || !password) {
        if (!email) errorEmail.textContent = "Ingrese su correo.";
        if (!password) errorPassword.textContent = "Ingrese su contraseña.";
        return;
      }

    db.collection("usuarios").get().then(snapshot => {
      let accesoPermitido = false;
      snapshot.forEach(doc => {
        const user = doc.data();
        if (
          user.correo &&
          user.contrasena &&
          user.correo.toLowerCase() === email &&
          user.contrasena === password
        ) {
          accesoPermitido = true;
          localStorage.setItem("userId", doc.id);
        }
      });

      if (accesoPermitido) {
        mostrarToast("Sesión iniciada correctamente", () => {
          window.location.href = "explorar.html";
        });
      } else {
        errorPassword.textContent = "Correo o contraseña incorrectos.";
      }
    });
    });

    function abrirModal() {
      document.getElementById("modalRecuperar").style.display = "flex";
    }

    function cerrarToast() {
      document.getElementById("toast").classList.remove("show");
    }

    function mostrarToast(mensaje, callback) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-text").textContent = mensaje;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
        if (callback) callback();
      }, 2500);
    }

    function verificarDatos() {
      const nombre = document.getElementById("recuperarNombre").value.trim().toLowerCase();
      const correo = document.getElementById("recuperarCorreo").value.trim().toLowerCase();

      if (!nombre || !correo) {
        alert("Por favor, complete todos los campos.");
        return;
      }

  db.collection("usuarios").get().then(snapshot => {
    let encontrado = false;
    snapshot.forEach(doc => {
      const user = doc.data();
      if (
        user.nombre &&
        user.correo &&
        user.nombre.toLowerCase() === nombre &&
        user.correo.toLowerCase() === correo
      ) {
        mostrarToast("Datos validados correctamente");
        alert("✅ Tu contraseña es: " + user.contrasena);
        encontrado = true;
      }
    });
    if (!encontrado) {
      alert("❌ Nombre o correo incorrectos.");
    }
  });

    }

    window.onclick = function (event) {
      const modal = document.getElementById("modalRecuperar");
      if (event.target === modal) modal.style.display = "none";
    }

    document.getElementById("mostrarContrasena").addEventListener("change", function () {
      const passInput = document.getElementById("password");
      passInput.type = this.checked ? "text" : "password";
    });

    // Navbar dinámico
    fetch("components/navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar-container").innerHTML = data;

        const botonesUsuario = document.getElementById("botonesUsuario");
        const userId = localStorage.getItem("userId");
        if (userId) {
          botonesUsuario.innerHTML = `
            <a href="perfil.html"><button class="btn btn-secundario">Mi perfil</button></a>
            <button onclick="cerrarSesion()" class="btn btn-primario">Cerrar sesión</button>
          `;
        } else {
          botonesUsuario.innerHTML = `
            <a href="register.html"><button class="btn btn-secundario">Registrarse</button></a>
            <a href="login.html"><button class="btn btn-primario">Iniciar sesión</button></a>
          `;
        }

        window.cerrarSesion = function () {
          localStorage.removeItem("userId");
          localStorage.setItem("mensajePerfil", "Sesión cerrada correctamente.");
          window.location.href = "index.html";
        };
      });
  </script>
</body>
</html>
