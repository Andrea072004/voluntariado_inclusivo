<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Voluntariado Inclusivo - Iniciar Sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/accesibilidad.css" />
</head>
<body class="login-body">

  <!-- Navbar dinámico -->
  <div id="navbar-container"></div>

  <!-- LOGIN -->
  <div class="login-container">
    <div class="login-header">
      <img src="img/logo_incluvoluntariado.jpg" alt="Logo Voluntariado" class="logo-login" />
      <h2>Iniciar Sesión</h2>
      <p>¿No tienes cuenta? <a href="register.html">Regístrate ahora</a></p>
    </div>

    <form id="loginForm">
      <div class="campo-formulario">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" required />
        <span class="error" id="error-email"></span>
      </div>

      <div class="campo-formulario">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required />
        <span class="error" id="error-password"></span>
      </div>

      <div class="campo-check">
        <input type="checkbox" id="mostrarContrasena" />
        <label for="mostrarContrasena">Mostrar contraseña</label>
      </div>

      <button type="submit" class="btn btn-login">Iniciar sesión</button>

      <div class="enlace-olvido">
        <a href="#" onclick="abrirModal()">¿Olvidaste tu contraseña?</a>
      </div>
    </form>

    <footer class="login-footer">
      <p>&copy; 2025 Voluntariado Inclusivo</p>
    </footer>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">
    <i>✔</i> <span id="toast-text">Sesión iniciada correctamente</span>
    <button onclick="cerrarToast()">×</button>
  </div>

  <!-- Modal Recuperar -->
  <div id="modalRecuperar" class="modal">
    <div class="modal-content">
      <h3>Recuperar Contraseña</h3>
      <input type="text" id="recuperarNombre" placeholder="Nombre completo" />
      <input type="email" id="recuperarCorreo" placeholder="Correo electrónico" />
      <button onclick="verificarDatos()">Recuperar</button>
    </div>
  </div>

  <script>
  fetch("components/navbar.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("navbar-container").innerHTML = data;

      const botonesUsuario = document.getElementById("botonesUsuario");
      const userId = localStorage.getItem("userId");
      if (botonesUsuario) {
        if (userId) {
          botonesUsuario.innerHTML = `
            <a href="perfil.html"><button class="btn btn-secundario">Mi perfil</button></a>
            <button onclick="cerrarSesion()" class="btn btn-primario">Cerrar sesión</button>
          `;
        } else {
          botonesUsuario.innerHTML = `
            <a href="register.html"><button class="btn btn-secundario">Registrarse</button></a>
            <a href="login.html"><button class="btn btn-primario">Iniciar sesión</button></a>
          `;
        }
      }

      window.cerrarSesion = function () {
        localStorage.removeItem("userId");
        localStorage.setItem("mensajePerfil", "Sesión cerrada correctamente.");
        window.location.href = "index.html";
      };
    });
</script>


  <!-- FLASK -->
   <script>
  document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value.trim();
    const errorEmail = document.getElementById("error-email");
    const errorPassword = document.getElementById("error-password");
    errorEmail.textContent = "";
    errorPassword.textContent = "";

    if (!email || !password) {
      if (!email) errorEmail.textContent = "Ingrese su correo.";
      if (!password) errorPassword.textContent = "Ingrese su contraseña.";
      return;
    }

    try {
      const response = await fetch("http://127.0.0.1:5000/api/users/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ correo: email, contrasena: password })
      });

      const data = await response.json();

      if (response.ok) {
        localStorage.setItem("userId", data.id);
        const nombre = data.nombre || "Usuario";
        mostrarToast(`¡Bienvenido, ${nombre.split(" ")[0]}!`, () => {
        window.location.href = "explorar.html";
        });
      } else {
        errorPassword.textContent = data.message || "Credenciales incorrectas.";
      }

    } catch (error) {
      alert("Error de conexión con el servidor.");
    }
  });
</script>

<script>
  // ✅ Mostrar/Ocultar contraseña
  document.addEventListener("DOMContentLoaded", function () {
    const mostrarCheckbox = document.getElementById("mostrarContrasena");
    const passwordInput = document.getElementById("password");

    if (mostrarCheckbox) {
      mostrarCheckbox.addEventListener("change", function () {
        passwordInput.type = this.checked ? "text" : "password";
      });
    }
  });

  // ✅ Abrir modal de recuperar contraseña
  function abrirModal() {
    document.getElementById("modalRecuperar").style.display = "flex";
  }

  // ✅ Cerrar modal al hacer clic fuera
  window.onclick = function (event) {
    const modal = document.getElementById("modalRecuperar");
    if (event.target === modal) {
      modal.style.display = "none";
    }
  };

  // ✅ Recuperar contraseña básica (client-side)
  function verificarDatos() {
    const nombre = document.getElementById("recuperarNombre").value.trim().toLowerCase();
    const correo = document.getElementById("recuperarCorreo").value.trim().toLowerCase();

    if (!nombre || !correo) {
      alert("Por favor, complete todos los campos.");
      return;
    }

    // Petición al backend para verificar datos (puedes migrarlo luego)
    fetch("http://127.0.0.1:5000/api/users/recuperar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nombre, correo })
    })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          alert("✅ Tu contraseña es: " + data.contrasena);
        } else {
          alert("❌ Nombre o correo incorrectos.");
        }
      })
      .catch(() => {
        alert("Error de conexión al recuperar contraseña.");
      });
  }
  function mostrarToast(mensaje, callback) {
  const toast = document.getElementById("toast");
  document.getElementById("toast-text").textContent = mensaje;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
    if (typeof callback === "function") callback();
  }, 2500);
}

function cerrarToast() {
  document.getElementById("toast").classList.remove("show");
}

</script>
<script src="js/main.js"></script>
<script src="js/navbar.js"></script>
  
</body>
</html>
