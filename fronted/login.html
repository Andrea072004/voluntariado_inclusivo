<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Voluntariado Inclusivo - Iniciar Sesión</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/estilos.css" />
  <style>
    .error {
      color: red;
      font-size: 13px;
      margin-top: 5px;
    }
  </style>
</head>

<body class="login-body">
  <header class="navbar">
    <div class="logo-menu">
      <img src="img/logo_incluvoluntariado.jpg" alt="Logo Voluntariado" class="logo" />
      <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="#">Voluntariado</a>
        <a href="#">Explorar oportunidades</a>
        <a href="#">Nosotros</a>
        <a href="#">Contacto</a>
      </nav>
    </div>
    <div class="botones-usuario">
      <a href="register.html"><button class="btn btn-secundario">Registrarse</button></a>
      <a href="login.html"><button class="btn btn-primario">Iniciar sesión</button></a>
    </div>
  </header>

  <div class="login-container">
    <div class="login-formulario">
      <div class="login-header">
        <img src="img/logo_incluvoluntariado.jpg" alt="Logo Voluntariado" class="logo-login" />
        <h2>Iniciar Sesión</h2>
        <p>¿No tienes cuenta? <a href="register.html">Regístrate ahora</a></p>
      </div>
      <form id="loginForm">
        <div class="campo-formulario">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required />
          <span class="error" id="error-email"></span>
        </div>
        <div class="campo-formulario">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required />
          <span class="error" id="error-password"></span>
        </div>
        <button type="submit" class="btn btn-login">Iniciar sesión</button>
      </form>
      <footer class="login-footer">
        <p>&copy; 2025 Voluntariado Inclusivo</p>
      </footer>
    </div>

    <div class="login-imagen">
      <img src="img/login-imagen.jpg" alt="Imagen de fondo de login" />
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>

  <!-- Lógica de login -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const firebaseConfig = {
        apiKey: "AIzaSyAqzhyPVGvQQdcQZ0D21CrJ6kltR_JM_Co",
        authDomain: "voluntariado-inclusivo.firebaseapp.com",
        databaseURL: "https://voluntariado-inclusivo-default-rtdb.firebaseio.com/",
        projectId: "voluntariado-inclusivo",
        storageBucket: "voluntariado-inclusivo.appspot.com",
        messagingSenderId: "400448703475",
        appId: "1:400448703475:web:72c8742f2a830e0f48e086"
      };

      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();
      const form = document.getElementById("loginForm");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const errorEmail = document.getElementById("error-email");
        const errorPassword = document.getElementById("error-password");

        errorEmail.textContent = "";
        errorPassword.textContent = "";

        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value.trim();

        if (!email || !password) {
          if (!email) errorEmail.textContent = "Ingrese su correo.";
          if (!password) errorPassword.textContent = "Ingrese su contraseña.";
          return;
        }

        db.ref("usuarios").once("value").then(snapshot => {
          let accesoPermitido = false;

          snapshot.forEach(child => {
            const user = child.val();
            if (
              user.correo && user.correo.trim().toLowerCase() === email &&
              user.contrasena && user.contrasena === password
            ) {
              accesoPermitido = true;
              localStorage.setItem("userId", child.key);
            }
          });

          if (accesoPermitido) {
            window.location.href = "perfil.html";
          } else {
            errorPassword.textContent = "Correo o contraseña incorrectos.";
          }
        });
      });
    });
  </script>
</body>
</html>
