<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #D9D9D9;
      color: #0D0D0D;
      min-height: 100vh;
    }

    .logo-menu {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .izquierda-navbar {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .register-container {
      display: flex;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      width: 90%;
      max-width: 1000px;
      margin: 60px auto;
    }

    .register-right {
      flex: 1;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-box h2 {
      text-align: center;
      margin-bottom: 30px;
      color: #1F98A6;
      font-size: 28px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-weight: 600;
      color: #0D0D0D;
    }

    input, select {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    button {
      background-color: #FFD700;
      color: #0D0D0D;
      padding: 14px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #D9695F;
      color: white;
    }

    .error {
      color: #D9695F;
      font-size: 14px;
      text-align: left;
    }

    @media (max-width: 768px) {
      .register-container {
        flex-direction: column;
      }

      .register-right {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR igual al index -->
  <header class="navbar">
    <div class="logo-menu">
      <div class="izquierda-navbar">
        <img src="img/logo_incluvoluntariado.jpg" alt="Logo Voluntariado" class="logo">
        <nav class="menu">
          <a href="index.html">Inicio</a>
          <a href="voluntariado.html">Voluntariado</a>
          <a href="#">Explorar oportunidades</a>
          <a href="nosotros.html">Nosotros</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
      <div class="botones-usuario" id="botonesUsuario">
        <!-- Se llena con JS -->
      </div>
    </div>
  </header>

  <!-- CONTENEDOR DE REGISTRO -->
  <div class="register-container">
    <div class="register-right">
      <div class="form-box">
        <h2>Crear una cuenta</h2>

        <form id="registerForm">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" required>

          <label for="condicion">Tipo de condición</label>
          <select id="condicion" required>
            <option value="">Seleccione</option>
            <option value="cronica">Enfermedad crónica</option>
            <option value="discapacidad">Discapacidad de desarrollo</option>
          </select>

          <label for="autonomia">Nivel de autonomía</label>
          <select id="autonomia" required>
            <option value="">Seleccione</option>
            <option value="libre">Apoyo libre</option>
            <option value="moderado">Moderado</option>
            <option value="total">Total</option>
          </select>

          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" required>

          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" required>
          <span class="error" id="errorMensaje"></span>

          <button type="submit">Registrarse</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAqzhyPVGvQQdcQZ0D21CrJ6kltR_JM_Co",
      authDomain: "voluntariado-inclusivo.firebaseapp.com",
      databaseURL: "https://voluntariado-inclusivo-default-rtdb.firebaseio.com/",
      projectId: "voluntariado-inclusivo",
      storageBucket: "voluntariado-inclusivo.appspot.com",
      messagingSenderId: "400448703475",
      appId: "1:400448703475:web:72c8742f2a830e0f48e086"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value.trim();
      const condicion = document.getElementById('condicion').value;
      const autonomia = document.getElementById('autonomia').value;
      const correo = document.getElementById('correo').value.trim().toLowerCase();
      const contrasena = document.getElementById('contrasena').value.trim();
      const errorMsg = document.getElementById('errorMensaje');

      const passwordRegex = /^(?=.*[A-Z]).{6,}$/;
      if (!passwordRegex.test(contrasena)) {
        errorMsg.textContent = "La contraseña debe tener al menos 6 caracteres y una letra mayúscula.";
        return;
      } else {
        errorMsg.textContent = "";
      }

      const nuevoUsuario = database.ref('usuarios').push();
      nuevoUsuario.set({
        nombre: nombre,
        condicion: condicion,
        autonomia: autonomia,
        correo: correo,
        contrasena: contrasena
      }).then(() => {
        alert("¡Registro exitoso!");
        window.location.href = "login.html";
      }).catch((error) => {
        alert("Error al registrar: " + error.message);
      });
    });

    // Mostrar botones según sesión
    window.addEventListener('load', () => {
      const botonesUsuario = document.getElementById('botonesUsuario');
      const userId = localStorage.getItem('userId');

      if (userId) {
        botonesUsuario.innerHTML = `
          <a href="perfil.html"><button class="btn btn-secundario">Mi perfil</button></a>
          <button onclick="cerrarSesion()" class="btn btn-primario">Cerrar sesión</button>
        `;
      } else {
        botonesUsuario.innerHTML = `
          <a href="register.html"><button class="btn btn-secundario">Registrarse</button></a>
          <a href="login.html"><button class="btn btn-primario">Iniciar sesión</button></a>
        `;
      }
    });

    function cerrarSesion() {
      localStorage.removeItem('userId');
      localStorage.setItem('mensajePerfil', 'Sesión cerrada correctamente.');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
