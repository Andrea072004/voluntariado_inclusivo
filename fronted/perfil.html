<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Perfil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tipografía y estilos -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    .perfil-container {
      max-width: 600px;
      margin: 60px auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .perfil-container h2 {
      text-align: center;
      color: #1F98A6;
      font-size: 30px;
      margin-bottom: 30px;
    }

    label {
      font-weight: bold;
      margin-top: 15px;
      display: block;
      color: #0D0D0D;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
    }

    .btn-actualizar {
      background-color: #1F98A6;
      color: white;
      padding: 14px;
      border: none;
      width: 100%;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .btn-actualizar:hover {
      background-color: #26A699;
    }

    .mensaje {
      text-align: center;
      font-weight: bold;
      margin-top: 20px;
      font-size: 16px;
    }

    .exito {
      color: #26A699;
    }

    .error {
      color: #D9695F;
    }

    .logo-menu {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .izquierda-navbar {
      display: flex;
      align-items: center;
      gap: 30px;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo-menu">
      <div class="izquierda-navbar">
        <img src="img/logo_incluvoluntariado.jpg" alt="Logo Voluntariado" class="logo">
        <nav class="menu">
          <a href="index.html">Inicio</a>
          <a href="voluntariado.html">Voluntariado</a>
          <a href="#">Explorar oportunidades</a>
          <a href="nosotros.html">Nosotros</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
      <div class="botones-usuario" id="botonesUsuario"></div>
    </div>
  </header>

  <div class="perfil-container">
    <h2>Mi Perfil</h2>
    <form id="perfilForm">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" required>

      <label for="condicion">Tipo de condición</label>
      <select id="condicion" required>
        <option value="">Seleccione</option>
        <option value="cronica">Enfermedad crónica</option>
        <option value="discapacidad">Discapacidad de desarrollo</option>
      </select>

      <label for="autonomia">Nivel de autonomía</label>
      <select id="autonomia" required>
        <option value="">Seleccione</option>
        <option value="libre">Apoyo libre</option>
        <option value="moderado">Moderado</option>
        <option value="total">Total</option>
      </select>

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" required disabled>

      <hr style="margin: 40px 0;">
      <h3>Habilidades e intereses</h3>

      <label for="habilidades">Habilidades:</label>
      <input type="text" id="habilidades" name="habilidades" placeholder="Ej: empatia, liderazgo, comunicacion asertiva">

      <label for="intereses">Intereses:</label>
      <select id="intereses" name="intereses" multiple size="3">
        <option value="Voluntariado en Biblioteca Comunitaria">Voluntariado en Biblioteca Comunitaria</option>
        <option value="Apoyo en Centros de Rehabilitación">Apoyo en Centros de Rehabilitación</option>
        <option value="Acompañamiento Virtual">Acompañamiento Virtual</option>
      </select>

      <button type="submit" class="btn-actualizar">Actualizar datos</button>
      <div id="mensaje" class="mensaje"></div>
    </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAqzhyPVGvQQdcQZ0D21CrJ6kltR_JM_Co",
      authDomain: "voluntariado-inclusivo.firebaseapp.com",
      databaseURL: "https://voluntariado-inclusivo-default-rtdb.firebaseio.com/",
      projectId: "voluntariado-inclusivo",
      storageBucket: "voluntariado-inclusivo.firebasestorage.app",
      messagingSenderId: "400448703475",
      appId: "1:400448703475:web:72c8742f2a830e0f48e086"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const userId = localStorage.getItem('userId');
    if (!userId) {
      alert('No se ha iniciado sesión.');
      window.location.href = 'login.html';
    } else {
      db.ref('usuarios/' + userId).once('value').then(snapshot => {
        const datos = snapshot.val();
        document.getElementById('nombre').value = datos.nombre || '';
        document.getElementById('condicion').value = datos.condicion || '';
        document.getElementById('autonomia').value = datos.autonomia || '';
        document.getElementById('correo').value = datos.email || '';
        document.getElementById('habilidades').value = datos.habilidades || '';

        const interesesSelect = document.getElementById('intereses');
        if (datos.intereses && Array.isArray(datos.intereses)) {
          Array.from(interesesSelect.options).forEach(opt => {
            if (datos.intereses.includes(opt.value)) {
              opt.selected = true;
            }
          });
        }
      });
    }

    document.getElementById('perfilForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value.trim();
      const condicion = document.getElementById('condicion').value;
      const autonomia = document.getElementById('autonomia').value;
      const habilidades = document.getElementById('habilidades').value.trim();
      const intereses = Array.from(document.getElementById('intereses').selectedOptions).map(o => o.value);
      const mensaje = document.getElementById('mensaje');

      if (!nombre || !condicion || !autonomia) {
        mensaje.textContent = 'Por favor, complete todos los campos obligatorios.';
        mensaje.className = 'mensaje error';
        return;
      }

      db.ref('usuarios/' + userId).update({
        nombre: nombre,
        condicion: condicion,
        autonomia: autonomia,
        habilidades: habilidades,
        intereses: intereses
      }).then(() => {
        mensaje.textContent = 'Datos actualizados correctamente.';
        mensaje.className = 'mensaje exito';

        if (Notification.permission === 'granted') {
          new Notification('Perfil actualizado con éxito.');
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
              new Notification('Perfil actualizado con éxito.');
            }
          });
        }
      }).catch(error => {
        mensaje.textContent = 'Error al actualizar: ' + error.message;
        mensaje.className = 'mensaje error';
      });
    });

    window.addEventListener('load', () => {
      const botonesUsuario = document.getElementById('botonesUsuario');
      if (userId) {
        botonesUsuario.innerHTML = `
          <a href="perfil.html"><button class="btn btn-secundario">Mi perfil</button></a>
          <button onclick="cerrarSesion()" class="btn btn-primario">Cerrar sesión</button>
        `;
      } else {
        botonesUsuario.innerHTML = `
          <a href="register.html"><button class="btn btn-secundario">Registrarse</button></a>
          <a href="login.html"><button class="btn btn-primario">Iniciar sesión</button></a>
        `;
      }
    });

    function cerrarSesion() {
      localStorage.removeItem('userId');
      localStorage.setItem('mensajePerfil', 'Sesión cerrada correctamente.');
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
