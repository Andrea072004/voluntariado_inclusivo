<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Perfil</title>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F2F2F2;
      margin: 0;
      padding: 20px;
    }

    .perfil-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #1A1A40;
    }

    label {
      font-weight: bold;
      margin-top: 10px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .btn-actualizar {
      background-color: #00AEEF;
      color: white;
      padding: 12px;
      border: none;
      width: 100%;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-actualizar:hover {
      background-color: #007EA7;
    }

    .mensaje {
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
    }

    .exito {
      color: green;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="perfil-container">
    <h2>Mi Perfil</h2>
    <form id="perfilForm">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" required>

      <label for="condicion">Tipo de condición</label>
      <select id="condicion" required>
        <option value="">Seleccione</option>
        <option value="cronica">Enfermedad crónica</option>
        <option value="discapacidad">Discapacidad de desarrollo</option>
      </select>

      <label for="autonomia">Nivel de autonomía</label>
      <select id="autonomia" required>
        <option value="">Seleccione</option>
        <option value="libre">Apoyo libre</option>
        <option value="moderado">Moderado</option>
        <option value="total">Total</option>
      </select>

      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" required disabled>

      <button type="submit" class="btn-actualizar">Actualizar datos</button>
      <div id="mensaje" class="mensaje"></div>
    </form>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAqzhyPVGvQQdcQZ0D21CrJ6kltR_JM_Co",
      authDomain: "voluntariado-inclusivo.firebaseapp.com",
      databaseURL: "https://voluntariado-inclusivo-default-rtdb.firebaseio.com/",
      projectId: "voluntariado-inclusivo",
      storageBucket: "voluntariado-inclusivo.firebasestorage.app",
      messagingSenderId: "400448703475",
      appId: "1:400448703475:web:72c8742f2a830e0f48e086"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Cargar datos del usuario desde localStorage
    const userId = localStorage.getItem('userId');
    if (!userId) {
      alert('No se ha iniciado sesión.');
      window.location.href = 'login.html';
    } else {
      db.ref('usuarios/' + userId).once('value').then(snapshot => {
        const datos = snapshot.val();
        document.getElementById('nombre').value = datos.nombre || '';
        document.getElementById('condicion').value = datos.condicion || '';
        document.getElementById('autonomia').value = datos.autonomia || '';
        document.getElementById('correo').value = datos.email || '';
      });
    }

    document.getElementById('perfilForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value.trim();
      const condicion = document.getElementById('condicion').value;
      const autonomia = document.getElementById('autonomia').value;
      const mensaje = document.getElementById('mensaje');

      if (!nombre || !condicion || !autonomia) {
        mensaje.textContent = 'Por favor, complete todos los campos.';
        mensaje.className = 'mensaje error';
        return;
      }

      db.ref('usuarios/' + userId).update({
        nombre: nombre,
        condicion: condicion,
        autonomia: autonomia
      }).then(() => {
        mensaje.textContent = 'Datos actualizados correctamente.';
        mensaje.className = 'mensaje exito';
      }).catch(error => {
        mensaje.textContent = 'Error al actualizar: ' + error.message;
        mensaje.className = 'mensaje error';
      });
    });
  </script>
</body>
</html>
